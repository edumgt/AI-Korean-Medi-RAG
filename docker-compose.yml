services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edumgt/ai-korean-medi-rag-app:latest
    ports:
    - 8111:8000
    environment:
      DOCS_PATH: ${DOCS_PATH:-/app/data/documents.jsonl}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://medrag:medrag@postgres:5432/medrag}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-med_rag}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-domain_docs}
      EMBED_MODEL: ${EMBED_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      USE_QDRANT: ${USE_QDRANT:-true}
    networks:
    - shared-net
networks:
  shared-net:
    external: true
