services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edumgt/ai-korean-medi-rag-app:latest
    ports:
      - "8000:8000"
    environment:
      DOCS_PATH: ${DOCS_PATH:-/app/data/documents.jsonl}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
